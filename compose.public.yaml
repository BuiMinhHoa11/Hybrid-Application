name: uniexam-public

# Chay tren EC2 uniexam-public (WireGuard 10.200.0.1).
# public-api hoat dong nhu Gateway, toan bo du lieu di qua WireGuard toi Private API (10.200.0.2:8080)
# KHONG CAN KET NOI DATABASE_URL HOAC REDIS_URL O DAY NUA!
x-env: &env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
  PUBLIC_API_URL: http://public-api:4000
  PRIVATE_API_URL: ${PRIVATE_API_URL:-http://10.200.0.2:8080}
  WORKER_URL: ${WORKER_URL:-http://10.200.0.2:8081}
  FRONTEND_URL: http://frontend

x-api-build: &api-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  public-api:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.public_app:app", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "127.0.0.1:${PUBLIC_API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      public-api:
        condition: service_healthy
    restart: unless-stopped