name: uniexam-private-app

# Chay tren instance uniexam-private (WireGuard 10.200.0.2).
# PostgreSQL va Redis do /srv/uniexam/compose.yml quan ly (cung mang uniexam-internal).
x-env: &env
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
  JWT_LIFETIME_HOURS: ${JWT_LIFETIME_HOURS:-8}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://<PUBLIC_DOMAIN>}
  PRIVATE_API_URL: http://private-api:8080
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://10.200.0.1:4000}
  WORKER_URL: http://grading-worker:8081
  FRONTEND_URL: ${FRONTEND_URL:-http://10.200.0.1:8080}
  GRADING_POLL_SECONDS: ${GRADING_POLL_SECONDS:-2}
  LIFECYCLE_INTERVAL_SECONDS: ${LIFECYCLE_INTERVAL_SECONDS:-5}
  LIFECYCLE_ENABLED: ${LIFECYCLE_ENABLED:-true}
  GRADING_QUEUE_NAME: ${GRADING_QUEUE_NAME:-uniexam:grading}
  GRADING_QUEUE_GROUP: ${GRADING_QUEUE_GROUP:-grading-workers}

x-api-build: &api-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  private-api:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.exam_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "10.200.0.2:${PRIVATE_API_PORT:-8080}:8080"
    networks:
      - uniexam-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grading-worker:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.worker:health_app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "10.200.0.2:${WORKER_PORT:-8081}:8081"
    networks:
      - uniexam-internal
    depends_on:
      private-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

networks:
  uniexam-internal:
    external: true