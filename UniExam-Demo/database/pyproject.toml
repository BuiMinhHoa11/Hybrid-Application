[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uniexam-database"
version = "0.1.0"
description = "PostgreSQL schema and migrations for UniExam"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["uniexam_database*"]

[tool.setuptools.package-data]
uniexam_database = ["schema.sql"]
