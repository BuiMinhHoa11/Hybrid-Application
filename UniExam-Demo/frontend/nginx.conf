# Frontend chạy trên EC2 uniexam-public.
# public-api chạy cùng stack; private-api chạy trên uniexam-private qua WireGuard.
# /health -> health check của frontend
# /api/ -> public-api (bỏ tiền tố /api)
# /exam-api/ -> private-api 10.200.0.2:8080 (bỏ tiền tố /exam-api)
# còn lại -> ứng dụng React (SPA)

resolver 127.0.0.11 valid=10s ipv6=off;

upstream uniexam_public_api {
    zone uniexam_public_api 64k;
    server public-api:4000 resolve;
}

upstream uniexam_private_api {
    zone uniexam_private_api 64k;
    server 10.200.0.2:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 4m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /api/admin/exam-alerts/stream {
        proxy_pass http://uniexam_public_api/admin/exam-alerts/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        gzip off;
    }

    location /api/ {
        proxy_pass http://uniexam_public_api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /exam-api/ {
        proxy_pass http://uniexam_private_api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
