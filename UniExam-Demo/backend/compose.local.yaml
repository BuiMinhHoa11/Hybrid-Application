# Local run of the Hybrid version. Keeps the existing local UniExam database.
name: uniexam-python

x-env: &env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://uniexam:uniexam@db:5432/uniexam_python
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-only-python-secret-change-before-production-12345}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-python-internal-key-change-me}
  CORS_ORIGINS: http://localhost:8081,http://localhost:5173
  PUBLIC_API_URL: http://public-api:4000
  PRIVATE_API_URL: http://private-api:8080
  WORKER_URL: http://grading-worker:8081
  FRONTEND_URL: http://frontend
  LIFECYCLE_ENABLED: "true"
  LIFECYCLE_INTERVAL_SECONDS: "5"
  GRADING_POLL_SECONDS: "2"

x-api-build: &api-build
  context: ..
  dockerfile: backend/Dockerfile

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 20s

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uniexam
      POSTGRES_PASSWORD: uniexam
      POSTGRES_DB: uniexam_python
    volumes: ["python_pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["local_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  private-api:
    build: *api-build
    environment:
      <<: *env
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-UniExam <no-reply@localhost>}
      APP_PUBLIC_URL: http://localhost:8081
      EMAIL_SEND_INTERVAL_SECONDS: ${EMAIL_SEND_INTERVAL_SECONDS:-1.1}
    command: ["sh", "-c", "python -m uniexam.cli init-db && uvicorn uniexam.exam_app:app --host 0.0.0.0 --port 8080"]
    ports: ["127.0.0.1:4101:8080"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
    restart: unless-stopped
  public-api:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.public_app:app", "--host", "0.0.0.0", "--port", "4000"]
    ports: ["127.0.0.1:4100:4000"]
    depends_on:
      private-api: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:4000/health',timeout=4)); assert d['status']=='ok'"]
    restart: unless-stopped
  grading-worker:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.worker:health_app", "--host", "0.0.0.0", "--port", "8081"]
    ports: ["127.0.0.1:4102:8081"]
    depends_on:
      private-api: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3)"]
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    volumes: ["../frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      public-api: {condition: service_healthy}
      private-api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  python_pgdata:
    name: uniexam-python_python_pgdata
  local_redisdata:
