name: uniexam-python

x-env: &env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uniexam}:${POSTGRES_PASSWORD:-uniexam}@db:5432/${POSTGRES_DB:-uniexam_python}
  JWT_SECRET: ${JWT_SECRET:-dev-only-python-secret-change-before-production-12345}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-python-internal-key-change-me}
  JWT_LIFETIME_HOURS: ${JWT_LIFETIME_HOURS:-8}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
  PUBLIC_API_URL: http://public-api:4000
  PRIVATE_API_URL: http://private-api:4001
  WORKER_URL: http://grading-worker:4002
  FRONTEND_URL: http://frontend
  GRADING_POLL_SECONDS: ${GRADING_POLL_SECONDS:-2}
  LIFECYCLE_INTERVAL_SECONDS: ${LIFECYCLE_INTERVAL_SECONDS:-5}
  LIFECYCLE_ENABLED: ${LIFECYCLE_ENABLED:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniexam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniexam}
      POSTGRES_DB: ${POSTGRES_DB:-uniexam_python}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["python_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  public-api:
    build: &api-build
      context: ..
      dockerfile: backend/Dockerfile
    environment: *env
    command: ["sh", "-c", "python -m uniexam.cli init-db && uvicorn uniexam.public_app:app --host 0.0.0.0 --port 4000"]
    ports: ["127.0.0.1:${PUBLIC_API_PORT:-4100}:4000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  private-api:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.exam_app:app", "--host", "0.0.0.0", "--port", "4001"]
    ports: ["127.0.0.1:${PRIVATE_API_PORT:-4101}:4001"]
    depends_on:
      public-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4001/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  grading-worker:
    build: *api-build
    environment: *env
    command: ["uvicorn", "uniexam.worker:health_app", "--host", "0.0.0.0", "--port", "4002"]
    ports: ["127.0.0.1:${WORKER_PORT:-4102}:4002"]
    depends_on:
      private-api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4002/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${FRONTEND_PORT:-8081}:80"]
    depends_on:
      public-api: {condition: service_healthy}
      private-api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  python_pgdata:
