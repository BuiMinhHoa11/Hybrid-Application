[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "uniexam-python"
version = "0.1.0"
description = "UniExam FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "uniexam-database==0.1.0",
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3", "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26", "bcrypt>=4,<6", "httpx>=0.27,<1", "redis>=5.2,<7", "alembic>=1.13,<2",
  "email-validator>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
uniexam-admin = "uniexam.cli:main"

[tool.setuptools.packages.find]
include = ["uniexam*"]

[tool.uv.sources]
uniexam-database = { path = "../database", editable = true }
