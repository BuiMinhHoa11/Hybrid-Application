name: uniexam-private-app

# Chạy trên instance uniexam-private (WireGuard 10.200.0.2).
# PostgreSQL và Redis đã do /srv/uniexam/compose.yml quản lý (mạng uniexam-internal).
x-env: &env
  ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
  JWT_LIFETIME_HOURS: ${JWT_LIFETIME_HOURS:-8}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://uniexam.publicvm.com}
  PRIVATE_API_URL: http://private-api:8080
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://10.200.0.1:4000}
  WORKER_URL: http://grading-worker:8081
  FRONTEND_URL: ${FRONTEND_URL:-http://10.200.0.1:8080}
  GRADING_POLL_SECONDS: ${GRADING_POLL_SECONDS:-2}
  LIFECYCLE_INTERVAL_SECONDS: ${LIFECYCLE_INTERVAL_SECONDS:-5}
  LIFECYCLE_ENABLED: ${LIFECYCLE_ENABLED:-true}
  GRADING_QUEUE_NAME: ${GRADING_QUEUE_NAME:-uniexam:grading}
  GRADING_QUEUE_GROUP: ${GRADING_QUEUE_GROUP:-grading-workers}
  # Email lịch thi (private-api gửi qua SMTP khi giáo viên phát hành kỳ thi)
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  MAIL_FROM: ${MAIL_FROM:-UniExam <no-reply@localhost>}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://uniexam.publicvm.com}
  EMAIL_SEND_INTERVAL_SECONDS: ${EMAIL_SEND_INTERVAL_SECONDS:-0}

# Healthcheck của Docker đang TẮT vì VM quá chậm (healthcheck bị treo chồng chất).
# Giám sát bằng script /srv/uniexam/healthcheck.sh (curl từ bên ngoài, chạy bằng cron).
# Khi máy mạnh hơn, có thể bật lại bằng khối dưới đây thay cho "disable: true":
#   healthcheck:
#     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=20)"]
#     interval: 30s
#     timeout: 30s
#     retries: 5
#     start_period: 180s

services:
  private-api:
    image: uniexam-backend:latest
    environment: *env
    networks:
      - uniexam-internal
    command: ["uvicorn", "uniexam.exam_app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "10.200.0.2:${PRIVATE_API_PORT:-8080}:8080"
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true
    pids_limit: 100
    mem_limit: 512m
    volumes: &code-mounts
      # Gắn THẲNG code từ repo đè lên bản trong image (chỉ đọc). Sửa code Python chỉ cần
      # git pull + docker compose restart, không phải build lại image (build trên VM này rất lâu).
      # Chỉ khi đổi thư viện (requirements.lock.txt) hoặc Dockerfile mới phải build lại.
      - /home/ubuntu/Hybrid-Application/UniExam-Demo/backend/uniexam:/usr/local/lib/python3.12/site-packages/uniexam:ro
      - /home/ubuntu/Hybrid-Application/UniExam-Demo/database/uniexam_database:/usr/local/lib/python3.12/site-packages/uniexam_database:ro

  grading-worker:
    image: uniexam-backend:latest
    environment: *env
    networks:
      - uniexam-internal
    command: ["uvicorn", "uniexam.worker:health_app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8081"
    depends_on:
      private-api:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped
    init: true
    pids_limit: 100
    mem_limit: 512m
    volumes: *code-mounts

networks:
  uniexam-internal:
    external: true
