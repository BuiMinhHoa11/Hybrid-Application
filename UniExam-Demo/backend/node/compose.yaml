# Chạy toàn bộ hệ thống ở máy local:  docker compose up --build
# Giao diện: http://localhost:8080   (đổi bằng FRONTEND_PORT trong .env)
# Migration chạy tự động khi public-api khởi động. Nạp dữ liệu mẫu: make seed

name: uniexam-node

x-service-env: &service-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-uniexam}:${POSTGRES_PASSWORD:-uniexam}@db:5432/${POSTGRES_DB:-uniexam}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-0123456789}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
  PRIVATE_API_URL: http://private-api:4001
  WORKER_URL: http://grading-worker:4002
  FRONTEND_URL: http://frontend
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  LIFECYCLE_INTERVAL_MS: ${LIFECYCLE_INTERVAL_MS:-5000}
  GRADING_POLL_MS: ${GRADING_POLL_MS:-2000}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uniexam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniexam}
      POSTGRES_DB: ${POSTGRES_DB:-uniexam}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  public-api:
    build:
      context: ../..
      dockerfile: backend/node/services/public-api/Dockerfile
    environment:
      <<: *service-env
      PUBLIC_API_PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PUBLIC_API_PORT:-4000}:4000"
    restart: unless-stopped

  # Chờ public-api khỏe để chắc chắn schema đã được migrate.
  private-api:
    build:
      context: ../..
      dockerfile: backend/node/services/private-api/Dockerfile
    environment:
      <<: *service-env
      PRIVATE_API_PORT: "4001"
    depends_on:
      public-api:
        condition: service_healthy
    ports:
      - "${PRIVATE_API_PORT:-4001}:4001"
    restart: unless-stopped

  grading-worker:
    build:
      context: ../..
      dockerfile: backend/node/services/grading-worker/Dockerfile
    environment:
      <<: *service-env
      WORKER_PORT: "4002"
    depends_on:
      private-api:
        condition: service_healthy
    ports:
      - "${WORKER_PORT:-4002}:4002"
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    depends_on:
      - public-api
      - private-api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
