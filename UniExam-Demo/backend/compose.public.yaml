name: uniexam-public

# Chạy trên EC2 uniexam-public (WireGuard 10.200.0.1).
# public-api là API gateway: không kết nối PostgreSQL/Redis, mọi request đi qua WireGuard
# tới private-api 10.200.0.2:8080. Frontend (Nginx) chuyển /api -> public-api,
# /exam-api -> thẳng private-api qua WireGuard.
#
# Cổng mở thêm trên 10.200.0.1 (IP WireGuard) để private-api kiểm tra được trạng thái
# public-api và frontend trên trang /admin/system-status. Internet không vào được IP này.
# Cần sysctl net.ipv4.ip_nonlocal_bind=1 để Docker bind được 10.200.0.1 kể cả khi wg0
# chưa lên lúc khởi động máy (xem README.production.md).
x-env: &env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
  PUBLIC_API_URL: http://public-api:4000
  PRIVATE_API_URL: ${PRIVATE_API_URL:-http://10.200.0.2:8080}
  WORKER_URL: ${WORKER_URL:-http://10.200.0.2:8081}
  FRONTEND_URL: http://frontend

x-api-build: &api-build
  context: ..
  dockerfile: backend/Dockerfile

services:
  public-api:
    build: *api-build
    image: uniexam-public-api:latest
    environment: *env
    command: ["uvicorn", "uniexam.public_app:app", "--host", "0.0.0.0", "--port", "4000"]
    ports:
      - "127.0.0.1:${PUBLIC_API_PORT:-4000}:4000"
      - "10.200.0.1:${PUBLIC_API_PORT:-4000}:4000"
    healthcheck:
      # /health luôn trả 200 (kèm trạng thái private-api), nên chỉ cần chờ đủ lâu.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: uniexam-frontend:latest
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
      - "10.200.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      public-api:
        condition: service_healthy
    restart: unless-stopped
